<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MusterMate - Next-Generation Cloud-Based Real-Time Labor Muster and Payroll Management System for construction, factory, and infrastructure projects." />
    <title>MusterMate - Enterprise Labor Muster & Payroll ERP</title>
    <!-- Apply saved theme before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mm_theme');
          if (t !== 'light') document.documentElement.classList.add('dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-just-black text-surface-cream antialiased font-mori">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
